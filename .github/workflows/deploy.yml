name: Deploy Site Vitrine CCIB38

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m

          script: |
            set -e

            echo "========================================"
            echo "Déploiement Site Vitrine CCIB38"
            echo "========================================"

            echo ""
            echo "=== Chargement de Node via NVM ==="

            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            else
              echo "ERREUR : NVM introuvable dans $NVM_DIR"
              exit 1
            fi

            nvm use 20

            echo ""
            echo "=== Versions Node / npm ==="

            which node
            node -v
            npm -v

            echo ""
            echo "=== Accès au projet ==="

            cd /home/ubuntu/projets/ccib38_vitrine_site

            echo ""
            echo "=== Récupération du dernier code ==="

            git fetch origin
            git reset --hard origin/main

            echo ""
            echo "=== Commit déployé ==="

            git log -1 --oneline

            echo ""
            echo "=== Installation des dépendances ==="

            npm ci

            echo ""
            echo "=== Build frontend ==="

            npm run build

            echo ""
            echo "=== Vérification du dossier dist ==="

            test -f dist/index.html

            ls -lah dist

            echo ""
            echo "=== Vérification Nginx ==="

            sudo nginx -t

            echo ""
            echo "========================================"
            echo "Déploiement terminé avec succès"
            echo "https://ccib38.fr"
            echo "========================================"